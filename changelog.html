<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070d16">
  <title>Changelog | Rocket Game Corner Status</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #050b14;
      --panel: rgba(12, 19, 28, 0.94);
      --line: rgba(255, 255, 255, 0.1);
      --text: #edf1f7;
      --muted: rgba(237, 241, 247, 0.72);
      --teal: #22f7d7;
    }

    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(circle at top, #13202e, var(--bg) 58%);
      color: var(--text);
      font-family: "DM Mono", monospace;
    }

    main {
      width: min(100%, 760px);
      padding: clamp(28px, 7vw, 64px);
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.36);
    }

    h1 {
      margin: 0;
      color: var(--teal);
      font-family: "Orbitron", sans-serif;
      font-size: clamp(1.8rem, 5vw, 2.5rem);
    }

    .intro {
      margin: 12px 0 32px;
      color: var(--muted);
      line-height: 1.6;
    }

    .release {
      padding: 22px 0;
      border-top: 1px solid var(--line);
    }

    h2 {
      margin: 0 0 14px;
      color: var(--teal);
      font-size: 1rem;
    }

    ul {
      margin: 0;
      padding-left: 22px;
      color: var(--text);
      line-height: 1.8;
    }

    .actions {
      display: flex;
      margin-top: 24px;
    }

    a {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 20px;
      border: 1px solid var(--teal);
      border-radius: 6px;
      background: var(--teal);
      color: #04110f;
      font-weight: 700;
      text-decoration: none;
      transition: background-color 160ms ease, color 160ms ease;
    }

    a:hover, a:focus-visible {
      background: transparent;
      color: var(--teal);
    }
  </style>
</head>
<body>
  <main>
    <h1>Changelog</h1>
    <p class="intro">Recent updates to Rocket Game Corner Status.</p>
    <section class="release" aria-labelledby="release-2026-10-21">
    <h2 id="release-2026-10-21">October 21, 2026</h2>
    <ul>
        <li>Updated game URL.</li>
        <li>Added changelog.</li>
    </ul>
    </section>
    <section class="release" aria-labelledby="release-2026-10-20">
      <h2 id="release-2026-10-20">October 20, 2026</h2>
      <ul>
        <li>Added the official Rocket Game Corner link to the home page.</li>
        <li>Improved the new-version preview with a home link and an updated continue button.</li>
      </ul>
    </section>
    <nav class="actions" aria-label="Page navigation">
      <a href="./index.html"><span aria-hidden="true">&larr;</span> Home</a>
    </nav>
  </main>
</body>
</html>
